name: Build and Release Windows Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Self-Contained Single-File EXE (win-x64)
        shell: pwsh
        run: |
          dotnet publish RobloxAccountManager.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish/win-x64

      - name: Package Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "publish/win-x64/RobloxAccountManager.exe" "dist/RobloxAccountManager.exe"
          Copy-Item "README.md" "dist/README.md"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/LICENSE" }
          Compress-Archive -Path "dist/RobloxAccountManager.exe", "dist/README.md" -DestinationPath "dist/RobloxAccountManager-win-x64-portable.zip" -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          name: "Roblox Account Manager ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || inputs.tag_name || 'v1.0.0' }} (Windows Portable)"
          generate_release_notes: true
          body: |
            ## 🇷🇺 Скачать и запустить (Windows 10 / 11 x64)
            1. Скачайте **`RobloxAccountManager.exe`** (или архив `RobloxAccountManager-win-x64-portable.zip`) ниже в разделе **Assets**.
            2. Запустите **`RobloxAccountManager.exe`** — **установка .NET не требуется** (всё уже встроено внутрь одного файла).
            3. Добавьте аккаунты через кнопку **«➕ Войти через браузер»** или **«🔑 Вставить Cookie»** и запускайте несколько окон Roblox в 1 клик!

            ---

            ## 🇬🇧 Download & Run (Windows 10 / 11 x64)
            1. Download **`RobloxAccountManager.exe`** (or `RobloxAccountManager-win-x64-portable.zip`) from the **Assets** section below.
            2. Run **`RobloxAccountManager.exe`** — **no .NET installation required** (standalone self-contained single-file executable).
            3. Add your accounts via **“➕ Войти через браузер” (Browser Login)** or **“🔑 Вставить Cookie” (Paste Cookie)** and launch multiple Roblox instances in 1 click!
          files: |
            dist/RobloxAccountManager.exe
            dist/RobloxAccountManager-win-x64-portable.zip
